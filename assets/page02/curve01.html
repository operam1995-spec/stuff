      el.style.cursor = 'move';
      el.addEventListener('pointerdown', function (e) {

            data: d.points,
            color: '#D95319',
            marker: { enabled: true, symbol: 'circle', radius: 5, lineWidth: 1,
                      lineColor: '#D95319', fillColor: '#D95319' }
          }
        ]
      });
      enableLegendDrag(chart);
      return chart;
    }

    if (typeof Highcharts === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<p style="color:red;font-size:18px">Highcharts library failed to load. ' +
        'Download https://code.highcharts.com/highcharts.js, save it as highcharts.js ' +
        'next to plot.html, then re-run the program.</p>');
    } else {
      var charts = {};
      // Charts are created only when their tab is visible, so sizes are correct
      function showTab(id) {
        document.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t.getAttribute('data-target') === id);
        });
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.toggle('active', p.id === id);
        });
        if (!charts[id]) charts[id] = makeChart(id);
        else charts[id].reflow();
      }
      document.querySelectorAll('.tab').forEach(function (t) {
        t.addEventListener('click', function () { showTab(t.getAttribute('data-target')); });
      });
      showTab('chart1');
    }
  </script>
</body>
</html>
