    function fmtAxis(v) {
      if (v === 0) return '0';
      var a = Math.abs(v);
      return (a < 1e-3 || a >= 1e4) ? v.toExponential(1) : String(+v.toPrecision(4));
    }
    function fmtVal(v) {
      var a = Math.abs(v);
      return (a !== 0 && a < 1e-3) ? v.toExponential(3) : v.toFixed(4);
    }

    function axisStyle(title, withLine) {
      var a = {
        title: { text: title, useHTML: true },
        gridLineWidth: 1,
        gridLineColor: '#d9d9d9',
        lineColor: '#262626',
        tickColor: '#262626',
        tickWidth: 1,
        tickLength: 6,
        tickPosition: 'inside',
        minorTickInterval: 'auto',
        minorGridLineWidth: 1,
        minorGridLineColor: '#ececec',
        minorGridLineDashStyle: 'Dot',
        minorTickWidth: 1,
        minorTickLength: 3,
        minorTickPosition: 'inside',
        minorTickColor: '#262626',
        labels: { style: { color: '#262626' } }
      };
      if (withLine) a.lineWidth = 1;
      return a;
    }

    function enableLegendDrag(chart) {
      var lg = chart.legend.group;
      if (!lg) return;
      var el = lg.element;
      var start = null;
      el.style.cursor = 'move';
      el.addEventListener('pointerdown', function (e) {
        start = { px: e.clientX, py: e.clientY, tx: lg.translateX, ty: lg.translateY };
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      el.addEventListener('pointermove', function (e) {
        if (!start) return;
        lg.translate(start.tx + e.clientX - start.px, start.ty + e.clientY - start.py);
      });
      var stop = function () { start = null; };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    }

    function makeChart(tab) {
      var box = document.getElementById(tab.id);
      var yAxis = axisStyle(tab.y, true);
      yAxis.labels.formatter = function () { return fmtAxis(this.value); };
      var xAxis = axisStyle('V<sub>DS</sub> (V)', false);
      var series = DATA[tab.id].map(function (s) {
        return {
          name: s.name, type: 'line', data: s.data, color: s.color, dashStyle: s.dash,
          lineWidth: 1.5, marker: { enabled: false }, turboThreshold: 0,
          states: { hover: { lineWidthPlus: 0 } }
        };
      });
      var chart = Highcharts.chart(tab.id, {
        chart: {
          type: 'line', animation: false,
          backgroundColor: '#ffffff', plotBackgroundColor: '#ffffff',
          plotBorderWidth: 1, plotBorderColor: '#262626',
          style: { fontFamily: 'Helvetica, Arial, sans-serif' }
        },
        title: { text: null },
        credits: { enabled: false },
        xAxis: xAxis,
        yAxis: yAxis,
        legend: {
          enabled: true, layout: 'vertical', align: 'right', verticalAlign: 'middle',
          maxHeight: Math.max(120, box.clientHeight - 90),
          backgroundColor: '#ffffff', borderColor: '#262626', borderWidth: 1,
          itemStyle: { fontWeight: 'normal', color: '#262626', fontSize: '11px' },
          useHTML: true
        },
        tooltip: {
          useHTML: true,
          formatter: function () {
            return this.series.name + '<br>V<sub>DS</sub>: ' + this.x.toFixed(4) +
                   '<br>' + tab.label + ': ' + fmtVal(this.y);
          }
        },
        plotOptions: { series: { animation: false } },
        series: series
      });
      enableLegendDrag(chart);
      return chart;
    }

    if (typeof Highcharts === 'undefined') {
      document.body.insertAdjacentHTML('afterbegin',
        '<p style="color:red;font-size:18px">Highcharts library failed to load. ' +
        'Save https://code.highcharts.com/highcharts.js as javascript/highcharts.js ' +
        'in the project folder, then re-run the program.</p>');
    } else {
      var charts = {};
      var tabsEl = document.getElementById('tabs');
      var panelsEl = document.getElementById('panels');
      TABS.forEach(function (t) {
        var b = document.createElement('button');
        b.className = 'tab';
        b.textContent = t.label;
        b.setAttribute('data-target', t.id);
        b.addEventListener('click', function () { showTab(t.id); });
        tabsEl.appendChild(b);
        var p = document.createElement('div');
        p.className = 'panel';
        p.id = t.id;
        panelsEl.appendChild(p);
      });
      // Charts are created only when their tab is visible, so sizes are correct
      function showTab(id) {
        document.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t.getAttribute('data-target') === id);
        });
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.toggle('active', p.id === id);
        });
        if (!charts[id]) {
          charts[id] = makeChart(TABS.filter(function (t) { return t.id === id; })[0]);
        } else {
          charts[id].reflow();
        }
      }
      if (TABS.length) showTab(TABS[0].id);
    }
  </script>
